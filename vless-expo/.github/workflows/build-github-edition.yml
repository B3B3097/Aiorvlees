name: 🚀 Build GitHub Edition (with TG Ads)

on:
  push:
    branches: [main, master]
    paths:
      - 'vless-expo/**'
  workflow_dispatch:

jobs:
  build-github-edition:
    name: Build GitHub Edition APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 📦 Install dependencies
        run: |
          npm ci
          echo "Dependencies installed successfully"

      - name: 🔧 Setup Expo CLI
        run: npm install -g expo-cli eas-cli
        shell: bash

      - name: 🛠 Configure EAS
        run: |
          echo "EAS CLI configured"
          eas --version

      - name: 🚀 Build Android APK (GitHub Edition) with EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS Build for GitHub Edition APK..."
          echo "This version includes permanent Telegram channel advertisement"
          eas build --profile preview --platform android --non-interactive --no-waiting
        working-directory: ./vless-expo
        continue-on-error: false

      - name: 📝 Build Summary
        run: |
          echo "✅ GitHub Edition build process completed!"
          echo ""
          echo "📱 Version: GitHub Edition"
          echo "📢 Features:"
          echo "   - Permanent Telegram channel ad on app launch"
          echo "   - Based on X-Ray core"
          echo ""
          echo "🔗 Download link will be available at:"
          echo "https://expo.dev/accounts/your-account/projects/vless-expo/builds"
          echo ""
          echo "⚠️ Note: This is a development build. For production, use 'production' profile."
        if: always()
