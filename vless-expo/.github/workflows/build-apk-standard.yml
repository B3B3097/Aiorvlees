name: 🤖 Build Android APK (Standard)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Standard APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 📦 Install dependencies
        run: |
          npm ci
          echo "Dependencies installed successfully"

      - name: 🔧 Setup Expo CLI
        run: npm install -g expo-cli eas-cli
        shell: bash

      - name: 🛠 Configure EAS
        run: |
          echo "EAS CLI configured"
          eas --version

      - name: 🚀 Build Android APK with EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS Build for Android APK..."
          eas build --profile preview --platform android --non-interactive --no-waiting
        working-directory: ./vless-expo
        continue-on-error: false

      - name: 📝 Build Summary
        run: |
          echo "✅ Build process completed!"
          echo ""
          echo "📱 Version: Standard Edition"
          echo "🔗 Download link will be available at:"
          echo "https://expo.dev/accounts/your-account/projects/vless-expo/builds"
          echo ""
          echo "⚠️ Note: Check the EAS dashboard for the download link."
        if: always()
