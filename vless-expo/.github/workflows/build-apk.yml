name: Build Development APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup EAS
        run: |
          echo "EAS_TOKEN=${{ secrets.EAS_TOKEN }}" >> $GITHUB_ENV
          # Если нужно, раскомментируйте для автоматической конфигурации
          # eas login --token ${{ secrets.EAS_TOKEN }}

      - name: Run prebuild (generate native code)
        run: npm run prebuild

      - name: Build Development APK
        run: |
          eas build --profile development --platform android --non-interactive \
            --wait --output vless-hunter-dev.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vless-hunter-development-apk
          path: vless-hunter-dev.apk
          retention-days: 30

      - name: Create Release (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: vless-hunter-dev.apk
          tag_name: dev-${{ github.sha }}
          name: Development Build ${{ github.sha }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
