name: Build APK (Fast)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PIP_NO_CACHE_DIR: "false"
  BUILD_DIR: ${{ github.workspace }}/.buildozer

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: ⚡ Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: ⚡ Cache Buildozer & Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: ${{ runner.os }}-buildozer-android-sdk-v2
          restore-keys: |
            ${{ runner.os }}-buildozer-android-sdk-

      - name: 🔧 Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-dev build-essential \
            git zip unzip libssl-dev libffi-dev \
            openjdk-17-jdk libncurses5 \
            autoconf automake libtool pkg-config \
            cmake ninja-build > /dev/null

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.37

      - name: 🛠 Pre-download Android SDK components
        run: |
          mkdir -p $BUILD_DIR/android/platform
          # Buildozer сам скачает, но можно ускорить предварительной загрузкой
          echo "SDK will be auto-downloaded by Buildozer"

      - name: 🚀 Build APK (Debug)
        run: |
          # Принять лицензии автоматически
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          
          # Запуск сборки с выводом лога
          buildozer -v android debug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vless-hunter-${{ github.sha }}
          path: bin/*.apk
          retention-days: 7
          compression-level: 6

      - name: 📋 Build Summary
        if: always()
        run: |
          echo "### 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`bin/*.apk\`" >> $GITHUB_STEP_SUMMARY
          ls -lh bin/*.apk 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "❌ APK not found" >> $GITHUB_STEP_SUMMARY
