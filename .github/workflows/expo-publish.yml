name: 🤖 Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================================
      # ШАГ 1: Получение кода из репозитория
      # ============================================================================
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================================
      # ШАГ 2: Настройка Node.js
      # ============================================================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vless-expo/package-lock.json

      # ============================================================================
      # ШАГ 3: Установка зависимостей npm
      # ============================================================================
      - name: 📥 Install NPM Dependencies
        run: |
          cd vless-expo
          echo "🔍 Проверка наличия package-lock.json..."
          if [ ! -f "package-lock.json" ]; then
            echo "⚠️ package-lock.json не найден, создаем..."
            npm install --package-lock-only
          fi
          echo "📦 Установка зависимостей..."
          npm ci --prefer-offline --no-audit --progress=false
          echo "✅ Зависимости установлены"

      # ============================================================================
      # ШАГ 4: Установка Expo CLI и EAS CLI глобально
      # ============================================================================
      - name: 🔧 Install Expo and EAS CLI
        run: |
          echo "📦 Установка expo-cli и eas-cli..."
          npm install -g expo-cli eas-cli
          echo "✅ Expo CLI версия: $(expo --version)"
          echo "✅ EAS CLI версия: $(eas --version)"

      # ============================================================================
      # ШАГ 5: Настройка Expo (авторизация)
      # ============================================================================
      - name: 🛠 Setup Expo Authentication
        uses: expo/expo-github-action@v8
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      # ============================================================================
      # ШАГ 6: Проверка конфигурации EAS
      # ============================================================================
      - name: 🔍 Validate EAS Configuration
        run: |
          cd vless-expo
          echo "📄 Проверка файла eas.json..."
          if [ ! -f "eas.json" ]; then
            echo "❌ Ошибка: eas.json не найден!"
            exit 1
          fi
          cat eas.json
          echo "✅ Конфигурация EAS найдена"

      # ============================================================================
      # ШАГ 7: Сборка APK через EAS Build
      # ============================================================================
      - name: 🏗️ Build Android APK with EAS
        id: eas_build
        run: |
          cd vless-expo
          echo "🚀 Запуск сборки APK (профиль preview)..."
          echo "💡 Эта сборка может занять 10-20 минут..."
          
          # Запускаем сборку в режиме non-interactive
          # --profile preview использует настройку из eas.json для создания APK
          # --platform android указывает платформу
          # --non-interactive для работы в CI
          # --wait ждет завершения сборки
          eas build \
            --profile preview \
            --platform android \
            --non-interactive \
            --wait \
            --output ../app-release.apk
          
          echo "✅ Сборка завершена успешно!"
          echo "📱 APK файл создан: app-release.apk"

      # ============================================================================
      # ШАГ 8: Загрузка артефакта (APK файла)
      # ============================================================================
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vless-app-release
          path: vless-expo/../app-release.apk
          retention-days: 14
          if-no-files-found: error

      # ============================================================================
      # ШАГ 9: Вывод информации о завершении
      # ============================================================================
      - name: 🎉 Build Complete
        run: |
          echo "============================================"
          echo "✅ СБОРКА УСПЕШНО ЗАВЕРШЕНА!"
          echo "============================================"
          echo "📱 APK файл доступен для скачивания:"
          echo "   - Перейдите на страницу Actions этого запуска"
          echo "   - В разделе 'Artifacts' скачайте 'vless-app-release'"
          echo "⏰ Артефакт будет доступен в течение 14 дней"
          echo "============================================"
