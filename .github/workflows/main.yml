name: Build APK (Fast)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 3.8 устарел, 3.10 стабильнее на новых раннерах

      - name: 🔧 Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-dev build-essential \
            git zip unzip libssl-dev libffi-dev \
            openjdk-17-jdk libncurses5 \
            autoconf automake libtool pkg-config \
            cmake ninja-build

      - name:  Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.37

      - name: 🚀 Build APK
        run: |
          # Авто-принятие лицензий Android SDK
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          buildozer -v android debug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4  # ← Только v4!
        with:
          name: vless-hunter-apk
          path: bin/*.apk
          retention-days: 7
